    <script>
      // SPA-on-GitHub-Pages decoder: pairs with the repo-root /404.html
      // redirect. When 404.html sends us to /pokeredge/?/sessions, restore
      // the URL to /pokeredge/sessions before React Router boots.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
