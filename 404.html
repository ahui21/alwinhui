<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PokerEdge AI</title>
    <script>
      // SPA fallback for GitHub Pages.
      // GitHub Pages serves this file for any 404. We capture the requested
      // deep-link path under /pokeredge/* and redirect to /pokeredge/?/<path>
      // so the SPA can restore the real URL via history.replaceState in its
      // index.html. Pairs with the decoder in pokeredge-app/index.html.
      (function () {
        var segmentsToKeep = 1; // keep "/pokeredge"
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
